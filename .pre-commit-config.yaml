# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Run manual autoupdate with:
#   pre-commit autoupdate --freeze
#   pre-commit run --all-files

# do not touch the migration files at all: these are auto-generated by Django
exclude: \/migrations\/

repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-ast
      - id: check-json
      - id: check-xml
        exclude: error\.xml$
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: \.html$|\.txt$
      - id: trailing-whitespace
        exclude: \.dot$
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # frozen: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: 809d037d62978decc620b5a55e8ee5b8b54d8d65  # frozen: v10.11.0
    hooks:
      - id: eslint
        args: [--fix, --color]
        additional_dependencies:
          - eslint@8.56.0
          - eslint-plugin-react@7.37.0
          - react@18.3.1
  - repo: https://github.com/rdmorganiser/mirrors-typos
    rev: 795fa58d4aaa206970c0b0d3a25f7cf9fd6668dc  # frozen: v1.50.3
    hooks:
    - id: typos
      exclude: |
        (?x)^(
            rdmo/locale/.*|
            rdmo/.*_de.html$|
            rdmo/.*_es.html$|
            rdmo/.*_fr.html$|
            rdmo/.*_it.html$|
            testing/.*.json|
            testing/.*.xml
        )$
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
    - id: zizmor
      args: [--fix, --offline]
ci:
  autofix_prs: false
