# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Run manual autoupdate with:
#   pre-commit autoupdate --freeze
#   pre-commit run --all-files

# do not touch the migration files at all: these are auto-generated by Django
exclude: \/migrations\/

repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-ast
      - id: check-json
      - id: check-xml
        exclude: error\.xml$
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: \.html$|\.txt$
      - id: trailing-whitespace
        exclude: \.dot$
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: aab412d509121cb5f7533134b7e67f9fab59c682  # frozen: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: 25057767de655a49a950fa4ac9c2cf47f32f9485  # frozen: v10.9.0
    hooks:
      - id: eslint
        args: [--fix, --color]
        additional_dependencies:
          - eslint@8.56.0
          - eslint-plugin-react@7.37.0
          - react@18.3.1
  - repo: https://github.com/crate-ci/typos
    rev: 12ffd4a04b4893ab75db66a59aaad2d996c3e982  # frozen: v1
    hooks:
    - id: typos
      exclude: |
        (?x)^(
            rdmo/locale/.*|
            rdmo/.*_de.html$|
            rdmo/.*_es.html$|
            rdmo/.*_fr.html$|
            rdmo/.*_it.html$|
            testing/.*.json|
            testing/.*.xml
        )$
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 451b56af716f9f0d0c2b816503a3fd0cf8b036fa  # frozen: v1.29.0
    hooks:
    - id: zizmor
      args: [--fix, --offline]
ci:
  autofix_prs: false
