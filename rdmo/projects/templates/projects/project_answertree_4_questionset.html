{% load core_tags %}

{% if set.count > 0 or set.total == 0 %}
    <h4>{{ set.title | markdown }}</h4>
    {% if include_help and "help" in set and set.help %}
        <div class="questionset-help text-muted mb-3">
        {% autoescape off %}
            {{set.help}}
        {% endautoescape %}
        </div>
    {% endif %}

    {% include 'projects/project_answertree_3_set.html' with sets=set.sets %}
{% endif %}
